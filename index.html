<script>

  sala:{

    {label:'Bajar por las <span class="voc">escaleras</span> hasta la <span class="voc">cocina</span> y tratar de encender la <span class="voc">luz</span>', goto:'cocina'},

    {label:'Volver al <span class="voc">dormitorio</span> para cerrar la <span class="voc">puerta</span>', goto:'start'}

},

  cocina:{
  id:'cocina',
   text:`La <span class="voc">cocina</span> está en penumbra. La <span class="voc">nevera</span> se abre sola con un crujido metálico, y un aire frío sale lentamente.

choices:[
    {label: 'Abrir con cuidado la <span class="voc">puerta</span> que conduce al <span class="voc">comedor</span>, donde la <span class="voc">mesa</span> parece estar lista para alguien', goto: 'comedor'},
    {label: 'Caminar lentamente hacia la <span class="voc">despensa</span>, pasando junto al <span class="voc">refrigerador</span> y los <span class="voc">armarios</span> que crujen en la oscuridad', goto: 'despensa'},

  despensa:{id:'despensa',text:`La <span class="voc">despensa</span> está envuelta en penumbra.

choices:[

/* ===== Áudio de terror (vento + batimentos + rangidos) ===== */
let ctx, ambient, sfx, windNode, hbOsc, hbGain;
function ensureAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)();
  ambient = ctx.createGain(); ambient.gain.value=0.18; ambient.connect(ctx.destination);
  sfx = ctx.createGain(); sfx.gain.value=0.32; sfx.connect(ctx.destination);

  // vento
  const size=2*ctx.sampleRate, buf=ctx.createBuffer(1,size,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<size;i++) ch[i]=(Math.random()*2-1)*0.55;
  windNode=ctx.createBufferSource(); windNode.buffer=buf; windNode.loop=true;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=650;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=35;
  windNode.connect(lp); lp.connect(hp); hp.connect(ambient); windNode.start();

  // batimentos
  hbOsc=ctx.createOscillator(); hbOsc.type='sine'; hbOsc.frequency.value=55;
  hbGain=ctx.createGain(); hbGain.gain.value=0.00001; hbOsc.connect(hbGain); hbGain.connect(ambient); hbOsc.start();
  (function loopHB(){const t=ctx.currentTime; hbGain.gain.setValueAtTime(0.00001,t); hbGain.gain.exponentialRampToValueAtTime(0.0025,t+0.02); hbGain.gain.exponentialRampToValueAtTime(0.00001,t+0.28); hbGain.gain.exponentialRampToValueAtTime(0.002,t+0.40); hbGain.gain.exponentialRampToValueAtTime(0.00001,t+0.70); setTimeout(loopHB,1200)})();
  setInterval(()=>creak(), 6000+Math.random()*4000);
}
function creak(){ if(!ctx)return; const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=140; const g=ctx.createGain(); g.gain.value=0.0008; g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.5); const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=500; o.connect(bp); bp.connect(g); g.connect(sfx); o.start(); o.stop(ctx.currentTime+0.7); flash(0.05); }
function boom(){ if(!ctx)return; const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=160; const g=ctx.createGain(); g.gain.value=0.002; g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.6); o.connect(g); g.connect(sfx); o.start(); o.stop(ctx.currentTime+0.6); shake(); }
function chime(){ if(!ctx)return; const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=520; const g=ctx.createGain(); g.gain.value=0.002; g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.5); o.connect(g); g.connect(sfx); o.start(); o.stop(ctx.currentTime+0.5); flash(0.08); }
function click(){ if(!ctx)return; const o=ctx.createOscillator(); o.type='square'; o.frequency.value=260; const g=ctx.createGain(); g.gain.value=0.0016; g.gain.exponentialRampToValueAtTime(0.00001,ctx.currentTime+0.12); o.connect(g); g.connect(sfx); o.start(); o.stop(ctx.currentTime+0.12); }
function flash(x){ const el=document.getElementById('flash'); el.style.background=`rgba(255,255,255,${x})`; setTimeout(()=>el.style.background='rgba(255,255,255,0)',60) }
function shake(){ const el=document.querySelector('.hero'); el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),600); }

/* ===== Estado / Render ===== */
let history=[], steps=0;
const $=s=>document.querySelector(s);
function savePlayer(name,group){localStorage.setItem('falange_escape_player',JSON.stringify({name,group,playedAt:new Date().toISOString()}))}
function loadPlayer(){try{return JSON.parse(localStorage.getItem('falange_escape_player'))}catch(e){return null}}
function pill(){const p=loadPlayer(); $('#player-pill').textContent=p?.name?`Jugador: ${p.name} • ${p.group||'—'}`:'Jugador: —'}
function show(id){['#start','#game','#end'].forEach(sel=>$(sel).classList.add('hidden')); $(id).classList.remove('hidden')}
function setHero(key){const v=$('#hero-video'); const item=VIDEOS[key]||VIDEOS.start; v.src=item.src; v.play().catch(()=>{}); $('#hero-cap').textContent=item.cap||''}

function render(id){
  const node = NODES[id]; if(!node) return;
  steps++; $('#progress').textContent = steps; history.push(id);

  if (node.end) {
    show('#end');
    $('#end-title').textContent = node.title;
    $('#end-text').innerHTML   = node.text;   // ← aqui (era textContent)
    setHero(id);
    if (node.end === 'good') chime(); else boom();
// envia os dados do jogador
try {
  const p = loadPlayer();
  const endType = node.end === 'good' ? 'good' : 'bad';
  sendToGoogleForms({
    name:  p?.name || '',
    group: p?.group || '',
    steps,
    endType,
    route: history.slice()
  });
} catch(e){}
    return;
  }

  show('#game');
  setHero(id);
  $('#scene-title').textContent = node.title;
  $('#scene-text').innerHTML    = node.text;   // ← aqui (era textContent)

  const box = $('#choices');
  box.innerHTML = '';
  node.choices.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML=ch.label;
    b.onclick = ()=>{ click(); render(ch.goto) };
    box.appendChild(b);
  });
}

function back(){ if(history.length<=1) return; history.pop(); const prev=history.pop(); steps=Math.max(0,steps-1); render(prev) }
function restart(){ history=[]; steps=0; $('#progress').textContent='0'; render('start') }
function exportTxt(){ const p=loadPlayer()||{name:'—',group:'—'}; const text=[`ESCAPA DE LA CASA ENCANTADA — FALANGE`,`Jugador: ${p.name} | Turma: ${p.group}`,`Fecha: ${new Date().toLocaleString()}`,`Pasos: ${steps}`,`Ruta: ${history.join(' -> ')}`].join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'})); a.download=`resultado_${Date.now()}.txt`; a.click(); }

/* ===== Eventos ===== */
function startGame(){
  const name = $('#name').value.trim();
  const group = $('#class').value.trim();

  if(!name || !group){
    alert('Por favor, escribe tu nombre y tu turma.');
    (!name ? $('#name') : $('#class')).focus();
    return;
  }

  savePlayer(name, group);
  pill();

  // toca a trilha de terror assim que o jogador clicar
  try {
    const bgm = document.getElementById('bgm');
    if (bgm) {
      bgm.volume = 0.6; // volume de 0 a 1
      bgm.muted = false;
      bgm.load();
      const p = bgm.play();
      if (p && typeof p.then === 'function') {
        p.catch(()=> {
          alert('O navegador bloqueou o áudio automático. Clique em qualquer lugar da página e tente novamente.');
        });
      }
    }
  } catch(e) {
    console.log('Erro ao tocar o áudio:', e);
  }

  // ativa os sons ambientes do jogo
  try { ensureAudio(); } catch(e) {}

  // vai para o jogo
  show('#game');
  setTimeout(()=>render('start'), 0);
}
$('#btnStart').addEventListener('click', startGame);
// 🔊 Ativa o áudio assim que o usuário clicar em qualquer lugar da tela inicial
document.addEventListener('click', () => {
  const bgm = document.getElementById('bgm');
  if (bgm && bgm.paused) {
    bgm.volume = 0.6; // volume inicial (0 a 1)
    bgm.muted = false;
    bgm.play().catch(() => {});
  }
}, { once: true });

document.addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('#start').classList.contains('hidden')) startGame() });
$('#testAudio').addEventListener('click',()=>{ try{ ensureAudio(); creak(); }catch(e){} });
const btnBack = document.querySelector('#btnBack');
if (btnBack) {
  btnBack.addEventListener('click', back);
}
$('#btnRestart').addEventListener('click', restart);
$('#btnAgain').addEventListener('click', restart);
$('#btnExport').addEventListener('click', exportTxt);

// Prefill
(function(){const p=loadPlayer(); if(p){ $('#name').value=p.name||''; $('#class').value=p.group||''; pill(); }})();

<script>
// tenta tocar ao carregar; se o navegador bloquear, ativa no 1º gesto (digitar/clicar/toque)
(function(){
  const VOLUME_INICIAL = 0.25;

  function tryPlay() {
    const bgm = document.getElementById('bgm');
    if (!bgm) return;
    bgm.volume = VOLUME_INICIAL;
    bgm.muted = false;
    const p = bgm.play();
    if (p && typeof p.then === 'function') {
      return p.catch(()=>{ /* bloqueado, sem problema */ });
    }
  }

  // tenta ao carregar a página
  window.addEventListener('load', () => { tryPlay(); });

  // se foi bloqueado, roda no primeiro gesto do usuário (inclusive TECLA ao digitar)
  function startOnFirstGesture() {
    tryPlay();
    // remove os listeners depois da 1ª tentativa, para não repetir
    ['pointerdown','keydown','touchstart'].forEach(evt =>
      window.removeEventListener(evt, startOnFirstGesture, true)
    );
  }
  ['pointerdown','keydown','touchstart'].forEach(evt =>
    window.addEventListener(evt, startOnFirstGesture, true)
  );
})();
</script>
<script>
// Oculta qualquer elemento que contenha exatamente esta frase (sem alterar o resto do jogo)
(function hideTagline(){
  const TARGET = "Vídeos realistas + audio de terror.";
  function run(){
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    const hits = [];
    while (walker.nextNode()) {
      const t = walker.currentNode;
      if ((t.nodeValue || "").trim() === TARGET || (t.nodeValue || "").includes(TARGET)) {
        hits.push(t);
      }
    }
    hits.forEach(t => {
      const el = t.parentElement;
      // esconde o contêiner imediato e, se existir, um contêiner maior típico de legenda
      (el.closest(".hero-caption, .tagline, header p, header .subtitle") || el).style.display = "none";
    });
  }
  run();
  // se o jogo recriar o cabeçalho dinamicamente, tenta de novo
  new MutationObserver(run).observe(document.body, {childList:true,subtree:true});
})();
</script>
